<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不同客群的需求與行銷訴求｜校園咖啡店互動簡報</title>
  <style>
    /* ==========================================================================
       全域視覺變數：米白底、深綠文字、綠色按鈕、淡黃提示框、白色圓角卡片
       ========================================================================== */
    :root {
      --bg-cream: #F7F5EE;
      --card-white: #FFFFFF;
      --text-dark-green: #1E3A2F;
      --text-muted: #4A6658;
      --btn-green: #2E6F4E;
      --btn-green-hover: #22563C;
      --btn-secondary-bg: #E9F1EC;
      --btn-secondary-hover: #D8E7DF;
      --border-soft: #E2DDD0;
      --border-selected: #2E6F4E;
      --hint-bg: #FFF9DF;
      --hint-border: #E8CF78;
      --hint-text: #5B4712;
      --success-bg: #EAF6EE;
      --success-border: #8CC9A4;
      --error-bg: #FDF1F0;
      --error-border: #E2A5A0;
      --shadow-card: 0 6px 20px rgba(30, 58, 47, 0.06);
      --shadow-hover: 0 10px 26px rgba(30, 58, 47, 0.12);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --focus-ring: 3px solid #2E6F4E;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-cream);
      color: var(--text-dark-green);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* 鍵盤 Tab 焦點框線：清楚可見 */
    :focus-visible {
      outline: var(--focus-ring);
      outline-offset: 3px;
    }

    /* 主版面容器 */
    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 1020px;
      margin: 0 auto;
      padding: 24px 20px 32px;
    }

    /* 頂部進度列與頁次 */
    .top-bar {
      background: var(--card-white);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      box-shadow: var(--shadow-card);
      margin-bottom: 24px;
    }

    .top-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .deck-brand {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .page-indicator {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--btn-green);
      background: var(--btn-secondary-bg);
      padding: 4px 14px;
      border-radius: var(--radius-pill);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #EAE6DA;
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 33.33%;
      background: var(--btn-green);
      border-radius: var(--radius-pill);
      transition: width 0.3s ease;
    }

    /* 簡報主內容區（一次僅顯示一頁） */
    .slide-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .slide {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .slide.is-active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 標題與導言區（適合課堂上台講解的大字距與留白） */
    .slide-header {
      margin-bottom: 24px;
    }

    .slide-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .slide-eyebrow {
      display: inline-block;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--btn-green);
      background: var(--btn-secondary-bg);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 10px;
    }

    .slide-title {
      margin: 0 0 10px;
      font-size: clamp(1.75rem, 3.2vw, 2.35rem);
      line-height: 1.3;
      color: var(--text-dark-green);
    }

    .slide-lead {
      margin: 0;
      font-size: clamp(1.08rem, 1.8vw, 1.24rem);
      color: var(--text-muted);
      max-width: 780px;
    }

    .highlight-quote {
      display: inline-block;
      color: var(--text-dark-green);
      font-weight: 700;
      border-bottom: 3px solid #CFE3D7;
    }

    /* ==========================================================================
       第一頁：雙情境可點擊卡片
       ========================================================================== */
    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 24px;
    }

    .scenario-card {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--card-white);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 28px 26px;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      color: inherit;
      font-family: inherit;
    }

    .scenario-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--btn-green);
    }

    .scenario-card.is-selected {
      border-color: var(--border-selected);
      background: #F4FAF6;
      box-shadow: 0 0 0 2px rgba(46, 111, 78, 0.18), var(--shadow-card);
    }

    .scenario-badge {
      display: inline-block;
      font-size: 0.92rem;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--btn-green);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 12px;
    }

    .scenario-title {
      margin: 0 0 10px;
      font-size: 1.48rem;
      line-height: 1.35;
      color: var(--text-dark-green);
    }

    .scenario-desc {
      margin: 0;
      font-size: 1.08rem;
      color: var(--text-muted);
    }

    .scenario-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--btn-green);
      margin-top: 4px;
    }

    /* ==========================================================================
       第二頁：目標客群 → 核心需求 → 對應行銷訴求 三段式卡片
       ========================================================================== */
    .switch-btn {
      appearance: none;
      background: var(--btn-secondary-bg);
      color: var(--text-dark-green);
      border: 2px solid var(--btn-green);
      border-radius: var(--radius-pill);
      padding: 11px 20px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      min-height: 46px;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .switch-btn:hover {
      background: var(--btn-secondary-hover);
      transform: translateY(-1px);
    }

    .flow-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: stretch;
      gap: 14px;
      margin-top: 20px;
    }

    .flow-card {
      background: var(--card-white);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 26px 22px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
    }

    .flow-card.is-accent {
      border: 2px solid var(--btn-green);
      background: #F4FAF6;
    }

    .flow-step-tag {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--btn-green);
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .flow-card-title {
      margin: 0 0 14px;
      font-size: 1.32rem;
      color: var(--text-dark-green);
    }

    .flow-card-body {
      margin: 0;
      font-size: 1.15rem;
      color: var(--text-dark-green);
      line-height: 1.75;
    }

    .flow-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--btn-green);
      user-select: none;
    }

    .presenter-note {
      margin-top: 22px;
      background: var(--hint-bg);
      border: 1px solid var(--hint-border);
      color: var(--hint-text);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 1rem;
    }

    /* ==========================================================================
       第三頁：隨堂測驗（單選卡片、提示框、完整解析）
       ========================================================================== */
    .quiz-box {
      background: var(--card-white);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 28px 26px;
      box-shadow: var(--shadow-card);
    }

    .quiz-question {
      margin: 0 0 22px;
      font-size: clamp(1.22rem, 2.2vw, 1.48rem);
      font-weight: 700;
      line-height: 1.5;
      color: var(--text-dark-green);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 22px;
    }

    .option-card {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--card-white);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      min-height: 60px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      font-family: inherit;
      font-size: 1.1rem;
      color: var(--text-dark-green);
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .option-card:hover:not(:disabled) {
      border-color: var(--btn-green);
      background: #F9FCF9;
    }

    .option-card.is-selected {
      border-color: var(--btn-green);
      background: #EEF7F1;
      box-shadow: 0 0 0 2px rgba(46, 111, 78, 0.16);
    }

    .option-card:disabled {
      cursor: not-allowed;
      opacity: 0.92;
    }

    .option-card.is-correct-reveal {
      border-color: var(--btn-green);
      background: var(--success-bg);
    }

    .option-card.is-wrong-reveal {
      border-color: #C96B63;
      background: var(--error-bg);
    }

    .option-key {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--btn-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: var(--btn-green);
      background: #FFFFFF;
      margin-top: 1px;
    }

    .option-card.is-selected .option-key {
      background: var(--btn-green);
      color: #FFFFFF;
    }

    .quiz-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    /* 按鈕樣式 */
    .btn {
      appearance: none;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 24px;
      min-height: 48px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease, transform 0.15s ease;
    }

    .btn-primary {
      background: var(--btn-green);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--btn-green-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--text-dark-green);
      border: 1px solid #C5DACD;
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--btn-secondary-hover);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* 回饋區域（淡黃提示框 / 完整解析框） */
    .feedback-area {
      margin-top: 22px;
    }

    .feedback-hint {
      background: var(--hint-bg);
      border: 2px solid var(--hint-border);
      color: var(--hint-text);
      border-radius: var(--radius-md);
      padding: 20px 22px;
    }

    .feedback-explain {
      background: var(--success-bg);
      border: 2px solid var(--success-border);
      color: var(--text-dark-green);
      border-radius: var(--radius-md);
      padding: 22px 24px;
    }

    .feedback-title {
      margin: 0 0 8px;
      font-size: 1.18rem;
      font-weight: 700;
    }

    .feedback-text {
      margin: 0;
      font-size: 1.08rem;
    }

    .explain-list {
      margin: 14px 0 0;
      padding-left: 20px;
    }

    .explain-list li {
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .explain-list li:last-child {
      margin-bottom: 0;
    }

    /* ==========================================================================
       底部導覽列（上一頁 / 下一頁 / 鍵盤提示）
       ========================================================================== */
    .bottom-nav {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .nav-hint {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
    }

    /* ==========================================================================
       手機與窄螢幕響應式調整（上下垂直排列）
       ========================================================================== */
    @media (max-width: 768px) {
      .app-shell {
        padding: 14px 14px 26px;
      }

      .scenario-grid {
        grid-template-columns: 1fr;
      }

      .flow-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .flow-arrow {
        transform: rotate(90deg);
        padding: 2px 0;
      }

      .quiz-box {
        padding: 20px 16px;
      }

      .bottom-nav {
        flex-direction: column-reverse;
        align-items: stretch;
      }

      .nav-buttons {
        width: 100%;
      }

      .nav-buttons .btn {
        flex: 1;
      }

      .nav-hint {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 頂部進度條與頁次指示 -->
    <header class="top-bar" aria-label="簡報進度">
      <div class="top-bar-row">
        <div class="deck-brand">行銷入門三分鐘｜不同客群的需求與行銷訴求</div>
        <div id="pageIndicator" class="page-indicator" aria-live="polite">第 1 / 3 頁・請選擇情境</div>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </header>

    <main class="slide-stage">
      <!-- ====================================================================
           第一頁：選擇探索情境（雙分支入口卡片）
           ==================================================================== -->
      <section id="slide-1" class="slide is-active" aria-labelledby="slide1-title">
        <div class="slide-header">
          <span class="slide-eyebrow">步驟 1｜鎖定目標客群</span>
          <h1 id="slide1-title" class="slide-title">校園咖啡店即將開幕，要先吸引誰？</h1>
          <p class="slide-lead">
            店長原本想用<span class="highlight-quote">「我們的咖啡很好喝」</span>吸引所有人，但行銷的第一步不是急著喊口號，而是先鎖定目標客群。請點擊下方任一張卡片，進入對應的情境解析：
          </p>
        </div>

        <div class="scenario-grid" id="scenarioCardsContainer">
          <!-- 由 JavaScript 依據設定物件動態產生兩張情境卡片 -->
        </div>
      </section>

      <!-- ====================================================================
           第二頁：對應情境的需求解析（目標客群 → 核心需求 → 對應行銷訴求）
           ==================================================================== -->
      <section id="slide-2" class="slide" aria-labelledby="slide2-title">
        <div class="slide-header slide-header-flex">
          <div>
            <span class="slide-eyebrow" id="slide2-eyebrow">步驟 2｜需求解析</span>
            <h1 id="slide2-title" class="slide-title">先選對象，再決定訴求</h1>
            <p class="slide-lead" id="slide2-subtitle"></p>
          </div>
          <button type="button" id="switchScenarioBtn" class="switch-btn">
            切換至另一情境
          </button>
        </div>

        <div class="flow-grid" id="analysisFlowContainer">
          <!-- 由 JavaScript 依據目前情境動態渲染三段式卡片 -->
        </div>

        <div class="presenter-note" id="presenterNote">
          <strong>講解小提醒：</strong>點擊右上角按鈕即可立即切換 A / B 情境，現場對比「趕時間」與「久坐討論」兩種客群截然不同的行銷切入點。
        </div>
      </section>

      <!-- ====================================================================
           第三頁：對應情境的隨堂測驗（單選互動、提示階段與完整解答）
           ==================================================================== -->
      <section id="slide-3" class="slide" aria-labelledby="slide3-title">
        <div class="slide-header">
          <span class="slide-eyebrow" id="slide3-eyebrow">步驟 3｜隨堂測驗</span>
          <h1 id="slide3-title" class="slide-title">換你替店長做決定</h1>
          <p class="slide-lead" id="slide3-subtitle"></p>
        </div>

        <div class="quiz-box">
          <p class="quiz-question" id="quizQuestion"></p>

          <div class="options-list" id="quizOptions" role="radiogroup" aria-labelledby="quizQuestion">
            <!-- 由 JavaScript 依據目前情境動態渲染選項卡片 -->
          </div>

          <div class="quiz-actions">
            <button type="button" id="submitQuizBtn" class="btn btn-primary" disabled>送出答案</button>
            <button type="button" id="resetQuizBtn" class="btn btn-secondary" style="display: none;">重新作答</button>
            <button type="button" id="revealAnswerBtn" class="btn btn-secondary" style="display: none;">查看完整解答</button>
          </div>

          <div id="quizFeedback" class="feedback-area" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <!-- 底部翻頁導覽 -->
    <footer class="bottom-nav" aria-label="簡報翻頁控制">
      <div class="nav-hint">支援鍵盤 <strong>←</strong> / <strong>→</strong> 方向鍵翻頁（首尾頁不循環）</div>
      <div class="nav-buttons">
        <button type="button" id="prevBtn" class="btn btn-secondary" disabled>← 上一頁</button>
        <button type="button" id="nextBtn" class="btn btn-primary" disabled>下一頁 →</button>
      </div>
    </footer>
  </div>

  <script>
    /* ==========================================================================
       【集中設定區】情境 A 與情境 B 的頁面文案、題目、選項、正解、解釋與提示
       日後若需調整簡報文字或題庫，僅需修改此物件即可。
       ========================================================================== */
    const SCENARIO_CONFIG = {
      A: {
        id: "A",
        label: "情境 A",
        shortName: "趕著上早八的學生",
        cardSummary: "痛點與需求是快速取餐、動線順暢與合適價格。",
        slide2Subtitle: "目前檢視：情境 A（趕著上早八的學生）的行銷訴求推導。",
        analysis: {
          target: "趕著上早八的學生",
          needs: "不想遲到、預算有限、拿了就走",
          appeal: "強調手機預先點餐、到店 30 秒快速取餐、早鳥銅板組合價"
        },
        quiz: {
          subtitle: "情境 A 專屬挑戰：試著站在早八學生的角度，挑出最精準的訴求。",
          question: "咖啡店決定優先服務「趕著上早八的學生」，哪一項行銷訴求最貼近他們的需求？",
          options: [
            { key: "A", text: "提供舒適沙發座，適合整個下午慢慢聊天。" },
            { key: "B", text: "手機預先點餐，到店免排隊 30 秒快速取餐。" },
            { key: "C", text: "店內每個角落都有網美牆，非常適合拍照打卡。" }
          ],
          correctKey: "B",
          explanations: {
            A: "選 A 解析：舒適座位適合久留，反而無法滿足急著離開去上課的需求。",
            B: "選 B 解析（正確）：快速取餐直接解決趕時間、怕遲到的核心痛點。",
            C: "選 C 解析：拍照空間對趕時間的學生沒有實質幫助。"
          },
          hints: {
            A: "「他現在需要坐下來停留，還是盡快離開去教室？」",
            C: "「漂亮的拍照空間能幫他趕在鐘響前到教室嗎？」"
          }
        }
      },
      B: {
        id: "B",
        label: "情境 B",
        shortName: "討論期末報告的學生",
        cardSummary: "痛點與需求是充足座位、插座、穩定網路與適合交談的空間。",
        slide2Subtitle: "目前檢視：情境 B（討論期末報告的學生）的行銷訴求推導。",
        analysis: {
          target: "討論報告的學生",
          needs: "久坐討論、筆電充電、不怕吵到人",
          appeal: "強調寬敞大桌、每席附設插座、不限時討論空間"
        },
        quiz: {
          subtitle: "情境 B 專屬挑戰：試著站在小組討論報告的角度，挑出最精準的訴求。",
          question: "咖啡店決定優先服務「需要討論報告的學生」，哪一項行銷訴求最貼近他們的需求？",
          options: [
            { key: "A", text: "主打外帶窗口，點完餐立刻帶走不佔位。" },
            { key: "B", text: "店內全面禁止交談，打造絕對安靜的個人自習室。" },
            { key: "C", text: "提供寬敞大桌、免費插座，以及可自由討論的空間。" }
          ],
          correctKey: "C",
          explanations: {
            A: "選 A 解析：外帶模式無法讓學生坐下來一起看資料、討論報告。",
            B: "選 B 解析：禁止交談會讓需要互相溝通的報告小組無法進行討論。",
            C: "選 C 解析（正確）：大桌、插座與可交談環境直接滿足小組討論報告的實際需求。"
          },
          hints: {
            A: "「討論報告需要大家聚在一起看電腦，外帶方便嗎？」",
            B: "「做小組報告時，組員之間需不需要互相開口溝通？」"
          }
        }
      }
    };

    /* ==========================================================================
       【狀態管理】
       - 預設邏輯說明：第一頁尚未點選任何情境卡片時，currentScenario 為 null，
         此時「下一頁」按鈕為停用狀態（避免未選情境即跳轉）；點選任一張情境卡片
         會立即記錄情境並跳轉至第二頁。之後若返回第一頁，因已選過情境，「下一頁」
         將保持啟用。
       - 雙情境作答紀錄各自獨立儲存在記憶體中，不寫入 localStorage，重新整理即重設。
       ========================================================================== */
    const state = {
      currentPage: 1, // 1, 2, 3
      currentScenario: null, // null | "A" | "B"
      quizState: {
        A: { selectedKey: null, stage: "idle" }, // stage: "idle" | "hint" | "explained"
        B: { selectedKey: null, stage: "idle" }
      }
    };

    /* DOM 參照 */
    const els = {
      slides: [
        document.getElementById("slide-1"),
        document.getElementById("slide-2"),
        document.getElementById("slide-3")
      ],
      pageIndicator: document.getElementById("pageIndicator"),
      progressTrack: document.getElementById("progressTrack"),
      progressFill: document.getElementById("progressFill"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),

      // 第一頁
      scenarioCardsContainer: document.getElementById("scenarioCardsContainer"),

      // 第二頁
      slide2Eyebrow: document.getElementById("slide2-eyebrow"),
      slide2Subtitle: document.getElementById("slide2-subtitle"),
      switchScenarioBtn: document.getElementById("switchScenarioBtn"),
      analysisFlowContainer: document.getElementById("analysisFlowContainer"),

      // 第三頁
      slide3Eyebrow: document.getElementById("slide3-eyebrow"),
      slide3Subtitle: document.getElementById("slide3-subtitle"),
      quizQuestion: document.getElementById("quizQuestion"),
      quizOptions: document.getElementById("quizOptions"),
      submitQuizBtn: document.getElementById("submitQuizBtn"),
      resetQuizBtn: document.getElementById("resetQuizBtn"),
      revealAnswerBtn: document.getElementById("revealAnswerBtn"),
      quizFeedback: document.getElementById("quizFeedback")
    };

    /* ==========================================================================
       渲染函式：第一頁（雙情境入口卡片）
       ========================================================================== */
    function renderSlide1() {
      els.scenarioCardsContainer.innerHTML = "";

      ["A", "B"].forEach((key) => {
        const sc = SCENARIO_CONFIG[key];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "scenario-card" + (state.currentScenario === key ? " is-selected" : "");
        btn.setAttribute("aria-pressed", state.currentScenario === key ? "true" : "false");

        btn.innerHTML = `
          <div>
            <span class="scenario-badge">${sc.label}</span>
            <h2 class="scenario-title">${sc.shortName}</h2>
            <p class="scenario-desc">${sc.cardSummary}</p>
          </div>
          <span class="scenario-cta">點擊進入${sc.label}解析 →</span>
        `;

        btn.addEventListener("click", () => {
          state.currentScenario = key;
          goToPage(2);
        });

        els.scenarioCardsContainer.appendChild(btn);
      });
    }

    /* ==========================================================================
       渲染函式：第二頁（三段式需求解析與情境切換）
       ========================================================================== */
    function renderSlide2() {
      if (!state.currentScenario) return;
      const sc = SCENARIO_CONFIG[state.currentScenario];
      const otherKey = state.currentScenario === "A" ? "B" : "A";
      const otherSc = SCENARIO_CONFIG[otherKey];

      els.slide2Eyebrow.textContent = `步驟 2｜${sc.label} 需求解析`;
      els.slide2Subtitle.textContent = sc.slide2Subtitle;
      els.switchScenarioBtn.textContent = `切換至 ${otherSc.label}（${otherSc.shortName}）`;

      els.analysisFlowContainer.innerHTML = `
        <article class="flow-card">
          <div class="flow-step-tag">01｜目標客群</div>
          <h2 class="flow-card-title">我們想服務誰？</h2>
          <p class="flow-card-body">${sc.analysis.target}</p>
        </article>

        <div class="flow-arrow" aria-hidden="true">→</div>

        <article class="flow-card">
          <div class="flow-step-tag">02｜核心需求</div>
          <h2 class="flow-card-title">他們最在意什麼？</h2>
          <p class="flow-card-body">${sc.analysis.needs}</p>
        </article>

        <div class="flow-arrow" aria-hidden="true">→</div>

        <article class="flow-card is-accent">
          <div class="flow-step-tag">03｜對應行銷訴求</div>
          <h2 class="flow-card-title">咖啡店該怎麼溝通？</h2>
          <p class="flow-card-body">${sc.analysis.appeal}</p>
        </article>
      `;
    }

    /* ==========================================================================
       渲染函式：第三頁（對應情境隨堂測驗、提示階段與完整解答）
       ========================================================================== */
    function renderSlide3() {
      if (!state.currentScenario) return;
      const sc = SCENARIO_CONFIG[state.currentScenario];
      const qData = sc.quiz;
      const qState = state.quizState[state.currentScenario];
      const isLocked = qState.stage !== "idle";

      els.slide3Eyebrow.textContent = `步驟 3｜${sc.label} 隨堂測驗`;
      els.slide3Subtitle.textContent = qData.subtitle;
      els.quizQuestion.textContent = qData.question;

      // 渲染選項卡片
      els.quizOptions.innerHTML = "";
      qData.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-card";
        btn.setAttribute("role", "radio");
        btn.setAttribute("aria-checked", qState.selectedKey === opt.key ? "true" : "false");

        if (qState.selectedKey === opt.key) {
          btn.classList.add("is-selected");
        }

        // 僅在「完整解答階段」標示正解或誤選樣式；提示階段不提前標示正解
        if (qState.stage === "explained") {
          if (opt.key === qData.correctKey) {
            btn.classList.add("is-correct-reveal");
          } else if (opt.key === qState.selectedKey) {
            btn.classList.add("is-wrong-reveal");
          }
        }

        btn.disabled = isLocked;

        btn.innerHTML = `
          <span class="option-key">${opt.key}</span>
          <span>${opt.text}</span>
        `;

        btn.addEventListener("click", () => {
          if (qState.stage !== "idle") return;
          qState.selectedKey = opt.key;
          renderSlide3();
        });

        els.quizOptions.appendChild(btn);
      });

      // 控制送出 / 重新作答 / 查看完整解答按鈕顯示狀態
      els.submitQuizBtn.disabled = !qState.selectedKey || isLocked;
      els.submitQuizBtn.style.display = isLocked ? "none" : "inline-block";
      els.resetQuizBtn.style.display = isLocked ? "inline-block" : "none";
      els.revealAnswerBtn.style.display = qState.stage === "hint" ? "inline-block" : "none";

      // 渲染回饋區
      if (qState.stage === "idle") {
        els.quizFeedback.innerHTML = "";
      } else if (qState.stage === "hint") {
        // 提示階段：僅顯示該錯誤選項的引導提示，不提前標示正解
        const hintText = qData.hints[qState.selectedKey] || "再想想這個客群當下最迫切的需求是什麼？";
        els.quizFeedback.innerHTML = `
          <div class="feedback-hint">
            <h3 class="feedback-title">再想一想（引導提示）</h3>
            <p class="feedback-text">${hintText}</p>
          </div>
        `;
      } else if (qState.stage === "explained") {
        // 完整解答階段：顯示正確選項與三個選項的完整理由
        const isCorrect = qState.selectedKey === qData.correctKey;
        const headingText = isCorrect
          ? `答對了！正確答案是選項 ${qData.correctKey}`
          : `完整解析｜正確答案是選項 ${qData.correctKey}`;

        const listItems = qData.options
          .map((opt) => `<li>${qData.explanations[opt.key]}</li>`)
          .join("");

        els.quizFeedback.innerHTML = `
          <div class="feedback-explain">
            <h3 class="feedback-title">${headingText}</h3>
            <ul class="explain-list">${listItems}</ul>
          </div>
        `;
      }
    }

    /* ==========================================================================
       整體介面更新（頁次、進度條、翻頁按鈕、切換頁面）
       ========================================================================== */
    function updateChrome() {
      // 切換可見頁面
      els.slides.forEach((slideEl, idx) => {
        slideEl.classList.toggle("is-active", idx + 1 === state.currentPage);
      });

      // 更新頁次與情境標示
      const scenarioLabel = state.currentScenario
        ? SCENARIO_CONFIG[state.currentScenario].label
        : "請選擇情境";
      els.pageIndicator.textContent = `第 ${state.currentPage} / 3 頁・${scenarioLabel}`;

      // 更新進度條
      const percent = (state.currentPage / 3) * 100;
      els.progressFill.style.width = `${percent}%`;
      els.progressTrack.setAttribute("aria-valuenow", String(state.currentPage));

      // 首尾頁停用不可用的翻頁鍵（不循環翻頁）
      els.prevBtn.disabled = state.currentPage === 1;
      els.nextBtn.disabled =
        state.currentPage === 3 ||
        (state.currentPage === 1 && !state.currentScenario);
    }

    function renderAll() {
      renderSlide1();
      renderSlide2();
      renderSlide3();
      updateChrome();
    }

    function goToPage(targetPage) {
      if (targetPage < 1 || targetPage > 3) return;
      if (targetPage > 1 && !state.currentScenario) return;

      state.currentPage = targetPage;
      renderAll();
      // 換頁時自動捲動回視窗頂部
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ==========================================================================
       事件綁定
       ========================================================================== */
    // 第二頁：切換至另一情境（保留各情境獨立的測驗狀態）
    els.switchScenarioBtn.addEventListener("click", () => {
      if (!state.currentScenario) return;
      state.currentScenario = state.currentScenario === "A" ? "B" : "A";
      renderAll();
    });

    // 第三頁：送出答案
    els.submitQuizBtn.addEventListener("click", () => {
      const scKey = state.currentScenario;
      if (!scKey) return;
      const qState = state.quizState[scKey];
      if (!qState.selectedKey || qState.stage !== "idle") return;

      const correctKey = SCENARIO_CONFIG[scKey].quiz.correctKey;
      if (qState.selectedKey === correctKey) {
        qState.stage = "explained";
      } else {
        // 答錯先進入提示階段，不提前揭露正解
        qState.stage = "hint";
      }
      renderSlide3();
    });

    // 第三頁：重新作答（解鎖選項並清除當次選取與回饋）
    els.resetQuizBtn.addEventListener("click", () => {
      const scKey = state.currentScenario;
      if (!scKey) return;
      state.quizState[scKey] = { selectedKey: null, stage: "idle" };
      renderSlide3();
    });

    // 第三頁：從提示階段手動展開完整解答
    els.revealAnswerBtn.addEventListener("click", () => {
      const scKey = state.currentScenario;
      if (!scKey) return;
      state.quizState[scKey].stage = "explained";
      renderSlide3();
    });

    // 底部翻頁按鈕
    els.prevBtn.addEventListener("click", () => goToPage(state.currentPage - 1));
    els.nextBtn.addEventListener("click", () => goToPage(state.currentPage + 1));

    // 鍵盤左右方向鍵翻頁（首尾頁不循環）
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        if (state.currentPage > 1) {
          event.preventDefault();
          goToPage(state.currentPage - 1);
        }
      } else if (event.key === "ArrowRight") {
        if (state.currentPage === 1 && state.currentScenario) {
          event.preventDefault();
          goToPage(2);
        } else if (state.currentPage === 2) {
          event.preventDefault();
          goToPage(3);
        }
      }
    });

    // 初始化渲染
    renderAll();
  </script>
</body>
</html>
